name: Publicar site (GitHub Pages)

# Nenhum segredo fica no repositório nem em logs:
#  - GOOGLE_MAPS_API_KEY  -> gravada em paginas/config.js só durante o deploy
#  - EVENTOS_FORM_URL     -> link do botão "Divulgar um evento"
#  - EVENTOS_CSV_URL      -> usado só aqui para gerar paginas/eventos.json;
#                            o endereço da planilha NÃO vai para o site.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # atualiza os eventos a cada hora
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gerar paginas/config.js a partir dos segredos
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
          EVENTOS_FORM_URL: ${{ secrets.EVENTOS_FORM_URL }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::Segredo GOOGLE_MAPS_API_KEY ausente: o site usará o mapa simples de apoio."
          fi
          jq -n -r \
            --arg key "$GOOGLE_MAPS_API_KEY" \
            --arg map "${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}" \
            --arg form "$EVENTOS_FORM_URL" \
            '"window.PANTANAL_CONFIG = " + ({
               GOOGLE_MAPS_API_KEY: $key,
               GOOGLE_MAPS_MAP_ID: $map,
               EVENTOS_FORM_URL: $form
             } | tojson) + ";"' > paginas/config.js

      - name: Gerar paginas/eventos.json (somente eventos aprovados)
        env:
          EVENTOS_CSV_URL: ${{ secrets.EVENTOS_CSV_URL }}
        run: python3 .github/scripts/gerar_eventos.py

      - name: Remover arquivos que não vão ao site
        run: |
          rm -rf .git .github
          rm -f paginas/config.example.js .gitignore

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
